name: e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      - name: Install e2e dependencies
        run: ./scripts/install-e2e-deps.sh
      - name: Bootstrap e2e infrastructure
        run: ./scripts/bootstrap-e2e.sh
      - name: Run e2e tests
        env:
          E2E_CONFIG: ${{ github.workspace }}/.tmp/e2e-config.yaml
        run: go test -tags e2e ./e2e -v
