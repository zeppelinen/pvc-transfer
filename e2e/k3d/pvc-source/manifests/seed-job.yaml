apiVersion: batch/v1
kind: Job
metadata:
  name: pvc-seed
  namespace: pvc-source-ns
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pvc-transfer-sa
      containers:
        - name: writer
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - mkdir -p /data/dir && echo hello-world > /data/dir/hello.txt && dd if=/dev/urandom of=/data/dir/random.bin bs=1M count=5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
