name: e2e

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      - name: Install e2e dependencies
        run: ./scripts/install-e2e-deps.sh
      - name: Bootstrap e2e infrastructure
        run: ./scripts/bootstrap-e2e.sh
      - name: Run e2e tests
        env:
          E2E_CONFIG: ${{ github.workspace }}/.tmp/e2e-config.yaml
        run: go test -tags e2e ./e2e -v
